[workspace]
resolver = "2"
members = [
    "spinctrl-tui",
    "spinctrl-service",
    "shared",
]

[workspace.package]
version = "0.1.1"
authors = ["SpinCtrl Contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/user/spinctrl"

[workspace.dependencies]
# Essential dependencies only
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.24"
crossterm = "0.27"
notify = "6.1"
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
chrono = { version = "0.4", features = ["serde"] }
nix = { version = "0.27", features = ["fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"